name: Promote tested release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag (v1.0.0) pointing to a successful staging commit
        required: true
        type: string
      staging_run_id:
        description: Successful CI and staging workflow run ID for that exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'johnDavid97/vartja'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_image: ${{ steps.release.outputs.app_image }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - name: Verify tag, successful staging run, immutable artifact and approval policy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: node scripts/deployment/release.mjs

  production:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://xn--vrtja-mra.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - name: Promote exact tested digest without rebuilding
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_APP_SERVICE_ID: ${{ vars.RAILWAY_APP_SERVICE_ID }}
          PRODUCTION_READY: ${{ vars.PRODUCTION_READY }}
          APP_IMAGE: ${{ needs.verify-release.outputs.app_image }}
        run: node scripts/deployment/railway.mjs production
      - name: Verify production TLS and public permission boundary
        run: node scripts/deployment/production-smoke.mjs
